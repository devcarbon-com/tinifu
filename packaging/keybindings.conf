# tinifu compositor keybinding snippets
#
# Press the key → tinifu.activate records from the mic (max 30 s),
# transcribes via the running daemon, and types the text into the
# focused window via wtype.
#
# Prerequisites:
#   - daemon running (see packaging/tinifu-daemon.service):
#       systemctl --user enable --now tinifu-daemon
#   - wtype installed (works on sway/Hyprland/wlroots; NOT on GNOME)
#   - pw-record (pipewire) or arecord (ALSA)

## Push-to-talk (works on any Wayland WM)
# Hold a key: record; release: transcribe + type. Two bindings:
bindsym $mod+z exec ~/.local/bin/jolt -A:time -m tinifu.ptt start
bindsym --release $mod+z exec ~/.local/bin/jolt -A:time -m tinifu.ptt end

## Hyprland
bind = SUPER, Z, exec, ~/.local/bin/jolt -A:time -m tinifu.ptt start
bindr = SUPER, Z, exec, ~/.local/bin/jolt -A:time -m tinifu.ptt end

## sway (~/.config/sway/config) — one-shot voice session
bindsym $mod+v exec ~/.local/bin/jolt -A:time -m tinifu.activate

## Hyprland (~/.config/hypr/hyprland.conf)
bind = SUPER, V, exec, ~/.local/bin/jolt -A:time -m tinifu.activate

## KDE Plasma (Wayland) — System Settings > Shortcuts > Add Command,
## or:
# kwriteconfig6 --file khotkeysrc ... (GUI recommended)

## GNOME
# Not supported: wtype cannot inject text on GNOME (no virtual-keyboard
# protocol exposure). Run `tinifu transcribe file.wav` from a terminal
# and paste instead.

# Notes:
# - The daemon must be running first; without it, activate exits with
#   "daemon unreachable".
# - TINIFU_SOCK can override the default socket path
#   ($XDG_RUNTIME_DIR/tinifu.sock) — must match the daemon's.
# - Recording is capped at 30 s; the clip is transcribed and injected
#   automatically when the cap is hit.
